name: Capture BlueMap

on:
  schedule:
    - cron: "0 0,12 * * *"
    - cron: "0 3,6,9,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      capture:
        description: Take new map images before deploying
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bluemap-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Capture timelapse frame
        if: ${{ github.event.schedule == '0 0,12 * * *' || (github.event_name == 'workflow_dispatch' && inputs.capture) }}
        run: bun run capture:once -- --url "$BLUEMAP_URL" --out captures --delay-ms 30000
        env:
          BLUEMAP_URL: "https://map.crabcraft.net/#world:0:0:0:700:0:0:0:1:flat"

      - name: Capture map.png
        if: ${{ github.event_name == 'schedule' || inputs.capture }}
        run: bun run capture:once -- --url "$BLUEMAP_URL" --file map.png --width 1080 --height 1080 --delay-ms 30000
        env:
          BLUEMAP_URL: "https://map.crabcraft.net/#world:-50:0:0:300:-1.57:0:0:1:flat"

      - name: Preserve current map.png
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.capture }}
        run: curl --fail --retry 3 --output map.png https://crabcraftmc.github.io/crabcraft-map-timelapse/map.png

      - name: Build Pages index
        run: bun run build:index -- --out site

      - name: Add map.png to Pages
        run: cp map.png site/map.png

      - name: Keep repo index current
        run: cp site/index.html index.html

      - name: Commit capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures index.html
          if git diff --cached --quiet; then
            echo "No new capture to commit."
          else
            git commit -m "chore: add BlueMap capture $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: Configure Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
